<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — GALAXY TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1a103c 0%, #0b0718 60%, #030108 100%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(20, 15, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
        }
        .neon-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <div>
        <header class="glass sticky top-0 z-50 border-b border-purple-900/35">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="index.html" class="text-2xl md:text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 neon-text">GALAXY TECH</a>
                
                <div class="flex items-center gap-3">
                    <a href="index.html" class="glass px-4 py-2 rounded-full border border-purple-500/30 text-xs font-bold text-purple-300 hover:text-white transition">
                        ← На главную
                    </a>
                    <a href="card.html" class="neon-btn text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-full transition flex items-center gap-2">
                        🛒 Корзина <span id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 my-12">
            <h1 class="text-3xl font-black text-center mb-8 uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 neon-text">❤️ Избранные товары</h1>

            <div id="favBox" class="flex items-center justify-center flex-wrap gap-6"></div>
        </main>
    </div>

    <!-- Футер -->
    <footer class="glass border-t border-purple-900/40 mt-20 py-10">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
            <div>
                <span class="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 neon-text">GALAXY TECH</span>
                <p class="text-xs text-purple-300/60 mt-1">Инновационные гаджеты с доставкой из космоса.</p>
            </div>
            <div class="flex items-center gap-6 text-xs text-purple-200/80">
                <a href="index.html" class="hover:text-cyan-400 transition">Каталог</a>
                <a href="favorites.html" class="hover:text-pink-400 transition">Избранное</a>
                <a href="cart.html" class="hover:text-purple-400 transition">Корзина</a>
            </div>
            <p class="text-[11px] text-purple-400/50">© 2026 GALAXY TECH. Все права защищены.</p>
        </div>
    </footer>

    <script src="./favorites.js"></script>
</body>
</html>
