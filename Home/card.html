<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваша корзина — GALAXY TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1a103c 0%, #0b0718 60%, #030108 100%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(20, 15, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
        }
        .neon-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }
        .neon-btn:hover {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.9);
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen p-6 relative">

    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <a href="index.html" class="text-cyan-400 hover:text-cyan-300 text-sm font-semibold transition">← Вернуться на главную</a>
            <button onclick="clearCart()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-xl transition shadow-lg">Очистить корзину</button>
        </div>

        <!-- УВЕДОМЛЕНИЕ С ТАЙМЕРОМ ОТМЕНЫ -->
        <div id="undoNotification" class="hidden mb-6 p-4 rounded-2xl bg-purple-950/80 border border-purple-500/40 flex items-center justify-between shadow-lg backdrop-blur-md">
            <span class="text-xs text-purple-200">Корзина очищена. Отменить действие? (<span id="countdownTimer" class="font-bold text-cyan-400">5</span> сек)</span>
            <button onclick="undoClearCart()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold uppercase rounded-xl transition">Отменить</button>
        </div>

        <h1 class="text-3xl font-black mb-8 uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 neon-text">Ваша корзина</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div id="cartBox" class="lg:col-span-2 flex items-start justify-center lg:justify-start flex-wrap gap-6"></div>

            <div class="glass p-6 rounded-3xl h-fit border border-purple-500/20">
                <h3 class="text-lg font-bold text-white mb-4 uppercase tracking-wider">Информация о заказе</h3>
                <div class="flex justify-between items-center mb-2 text-sm text-purple-200/70">
                    <span>Количество товаров:</span>
                    <span id="totalCount" class="font-bold text-white">0 шт.</span>
                </div>
                <div class="flex justify-between items-center mb-6 text-base text-purple-200/70">
                    <span>Итоговая сумма:</span>
                    <span id="totalPrice" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">$0</span>
                </div>
                <button onclick="openCheckoutModal()" id="checkoutBtn" class="neon-btn w-full text-white text-sm font-bold uppercase tracking-wider py-3.5 rounded-xl transition">Оформить и оплатить</button>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-3xl border border-cyan-500/30 relative">
            <h2 class="text-2xl font-black text-white mb-6 uppercase tracking-wider text-center neon-text">Проведение оплаты</h2>
            
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase text-purple-300 mb-2">Имя и фамилия</label>
                <input type="text" id="buyerName" class="w-full p-3 bg-black/40 border border-purple-500/30 rounded-xl text-xs text-purple-200 placeholder-purple-400/40 outline-none focus:border-cyan-400" placeholder="Иван Иванов">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase text-purple-300 mb-2">Способ оплаты</label>
                <select id="paymentMethod" class="w-full p-3 bg-black/80 border border-purple-500/30 rounded-xl text-xs text-purple-200 outline-none focus:border-cyan-400">
                    <option value="card">Банковская карта (Uzcard / Humo / Visa)</option>
                    <option value="crypto">Космическая криптовалюта (USDT)</option>
                    <option value="cash">Наличными курьеру</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-semibold uppercase text-purple-300 mb-2">Номер карты / Кошелек</label>
                <input type="text" class="w-full p-3 bg-black/40 border border-purple-500/30 rounded-xl text-xs text-purple-200 placeholder-purple-400/40 outline-none focus:border-cyan-400" placeholder="8600 0000 0000 0000">
            </div>

            <div class="flex gap-4">
                <button onclick="closeCheckoutModal()" class="w-1/2 py-3 bg-white/5 hover:bg-white/10 text-purple-300 text-xs font-bold uppercase rounded-xl transition border border-white/10">Отмена</button>
                <button onclick="processPayment()" class="w-1/2 neon-btn py-3 text-white text-xs font-bold uppercase rounded-xl transition">Оплатить</button>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
